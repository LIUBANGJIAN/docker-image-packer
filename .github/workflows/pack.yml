name: Pack Docker Images

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # 1. 解析 images.txt 并动态生成矩阵
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Generate Matrix
        id: set-matrix
        run: |
          # 读取 images.txt，过滤掉注释和空行，转换为 JSON 数组
          JSON_ARRAY=$(grep -v '^#' images.txt | grep -v '^\s*$' | jq -R . | jq -s -c .)
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT

  # 2. 矩阵并行构建与导出：每个镜像独立开一个 Job，独立打包为单个 ZIP
  build-and-pack:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # 清除凭证进入纯匿名模式，规避登录 Token 冲突
      - name: Force Anonymous Mode
        run: |
          docker logout ghcr.io || true
          docker logout docker.io || true

      - name: Process Image
        id: process
        run: |
          LINE="${{ matrix.target }}"
          echo "=================================================="

          # 模式 A：源码现场构建 (build:https://github.com/xxx.git|tag_name)
          if [[ "$LINE" == build:* ]]; then
            BUILD_INFO=${LINE#build:}
            GIT_URL=$(echo "$BUILD_INFO" | cut -d'|' -f1)
            IMAGE_TAG=$(echo "$BUILD_INFO" | cut -d'|' -f2)
            [ -z "$IMAGE_TAG" ] && IMAGE_TAG="custom-build:latest"

            echo "【源码构建模式】 Git 仓库: $GIT_URL"
            git clone --depth 1 "$GIT_URL" temp_repo
            cd temp_repo
            docker build -t "$IMAGE_TAG" .
            cd .. && rm -rf temp_repo
            TARGET_IMAGE="$IMAGE_TAG"

          # 模式 B：直接拉取模式 (Docker Hub 或 GHCR 镜像)
          else
            TARGET_IMAGE="$LINE"
            echo "【直接拉取模式】 镜像名: $TARGET_IMAGE"
            docker pull "$TARGET_IMAGE"
          fi

          # 格式化导出文件与 Artifacts 名称
          SAFE_NAME=$(echo "$TARGET_IMAGE" | sed 's/[^a-zA-Z0-9._-]/_/g')
          TAR_FILE="${SAFE_NAME}.tar"
          ZIP_FILE="${SAFE_NAME}.zip"

          echo "正在导出镜像 $TARGET_IMAGE 到 $TAR_FILE ..."
          docker save "$TARGET_IMAGE" -o "$TAR_FILE"
          
          echo "正在压缩为 $ZIP_FILE ..."
          zip -j "$ZIP_FILE" "$TAR_FILE"
          
          echo "zip_path=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "artifact_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      # 3. 独立上传单独的 ZIP Artifact（保存 7 天）
      - name: Upload Single Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.process.outputs.artifact_name }}
          path: ${{ steps.process.outputs.zip_path }}
          retention-days: 7
